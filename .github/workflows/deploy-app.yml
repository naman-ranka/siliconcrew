name: Deploy App

# Model A: build + push SHA-tagged images and roll them out with
# `gcloud run deploy`. Infra (env, scaling, secrets) stays Terraform-owned; the
# two services have lifecycle.ignore_changes on their image so Terraform won't
# revert these rollouts. See deploy/CICD.md.
#
# Runs ONLY after the CI workflow succeeds on `main` (so untested code is never
# deployed). The ORFS image is NOT built here — it's the 6.5 GB heavyweight and
# rarely changes; rebuild it via Terraform / a dedicated manual step.

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

# Serialize rollouts. cancel-in-progress stays FALSE on purpose: backend and
# frontend deploy sequentially, and cancelling between the two ships a
# version-skewed pair — worse than being one commit behind. GitHub keeps only
# the newest pending run per group, so a burst of merges collapses to at most
# one queued deploy behind the running one; the tip guard below makes a stale
# queued run a no-op.
concurrency:
  group: deploy-app
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write   # required for keyless Workload Identity Federation

jobs:
  deploy:
    # Only when CI passed on main.
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    env:
      PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      REGION: ${{ vars.GCP_REGION }}
      AR_REPO: siliconcrew
      SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Checkout the tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      # Parallel CI runs from a multi-push merge each trigger a deploy; without
      # this guard the LAST writer wins regardless of commit order (raced on
      # 2026-07-18 and shipped a stale image). A superseded run self-skips.
      - name: Bail out if this commit is no longer main's tip
        id: tip
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TIP=$(gh api "repos/${{ github.repository }}/commits/main" --jq .sha)
          if [ "$TIP" != "$SHA" ]; then
            echo "::notice::${SHA} superseded by ${TIP}; skipping deploy."
            echo "stale=true" >> "$GITHUB_OUTPUT"
          else
            echo "stale=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Authenticate to Google Cloud (keyless / WIF)
        if: steps.tip.outputs.stale != 'true'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}

      - name: Set up gcloud
        if: steps.tip.outputs.stale != 'true'
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        if: steps.tip.outputs.stale != 'true'
        run: gcloud auth configure-docker ${REGION}-docker.pkg.dev --quiet

      - name: Build & push images (tagged with the commit SHA)
        if: steps.tip.outputs.stale != 'true'
        run: |
          set -euo pipefail
          IMG="${REGION}-docker.pkg.dev/${PROJECT_ID}/${AR_REPO}"
          docker build -t "$IMG/backend:${SHA}"  -f Dockerfile .
          docker build -t "$IMG/frontend:${SHA}" -f frontend/Dockerfile frontend
          docker push "$IMG/backend:${SHA}"
          docker push "$IMG/frontend:${SHA}"

      - name: Deploy to Cloud Run (image-only update; preserves env/secrets)
        if: steps.tip.outputs.stale != 'true'
        run: |
          set -euo pipefail
          IMG="${REGION}-docker.pkg.dev/${PROJECT_ID}/${AR_REPO}"
          gcloud run deploy siliconcrew-backend \
            --image "$IMG/backend:${SHA}" --region "${REGION}" --quiet
          gcloud run deploy siliconcrew-frontend \
            --image "$IMG/frontend:${SHA}" --region "${REGION}" --quiet

      - name: Summary
        if: steps.tip.outputs.stale != 'true'
        run: |
          echo "Deployed backend + frontend @ ${SHA}" >> "$GITHUB_STEP_SUMMARY"
          gcloud run services describe siliconcrew-frontend --region "${REGION}" \
            --format='value(status.url)' >> "$GITHUB_STEP_SUMMARY"
