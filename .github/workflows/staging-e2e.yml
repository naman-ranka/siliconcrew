name: Staging E2E

# Manual-only: drives a real design through the DEPLOYED app with Playwright —
# sign-in (WorkOS AuthKit), session creation, RTL write, simulation — and
# asserts the honest-state surfaces (manifest tops, collision warnings, sim
# run record). Runs from Actions because it needs egress to the Cloud Run
# services.
#
# Credentials: prefers repo secrets STAGING_E2E_EMAIL / STAGING_E2E_PASSWORD;
# dispatch inputs are a fallback for ad-hoc runs (masked from logs below, but
# dispatch inputs are visible in the run's event payload to repo readers —
# prefer the secrets).

# NOTE: workflow_dispatch only becomes dispatchable once this file exists on
# the default branch — until this PR merges, the push trigger below (scoped to
# the PR branch) is how it runs.
on:
  push:
    branches: [claude/silicon-crew-pr-review-a7pxqf]
    paths:
      - ".github/workflows/staging-e2e.yml"
      - "frontend/e2e-staging/**"
  workflow_dispatch:
    inputs:
      base_url:
        description: "Frontend base URL"
        default: "https://siliconcrew-frontend-psp2dkllmq-uc.a.run.app"
        type: string
      email:
        description: "Sign-in email (fallback when STAGING_E2E_EMAIL secret is unset)"
        default: ""
        type: string
      password:
        description: "Sign-in password (fallback when STAGING_E2E_PASSWORD secret is unset)"
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: staging-e2e
  cancel-in-progress: false

jobs:
  e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install deps
        run: npm ci

      - name: Install Playwright chromium
        run: npx playwright install --with-deps chromium

      - name: Run staging e2e
        env:
          STAGING_BASE_URL: ${{ inputs.base_url || 'https://siliconcrew-frontend-psp2dkllmq-uc.a.run.app' }}
          # TEMPORARY, REMOVE BEFORE MERGE: throwaway staging TEST-ACCOUNT
          # credentials, owner-provided for this branch's e2e. The dispatch
          # path couldn't run pre-merge (see the trigger note above) and this
          # repo has no STAGING_E2E_* secrets yet. Rotate the password and
          # move these to repo secrets when this branch merges.
          STAGING_EMAIL: ${{ secrets.STAGING_E2E_EMAIL || inputs.email || 'rockstarme.the5@gmail.com' }}
          STAGING_PASSWORD: ${{ secrets.STAGING_E2E_PASSWORD || inputs.password || 'staging@claude' }}
        run: |
          echo "::add-mask::$STAGING_EMAIL"
          echo "::add-mask::$STAGING_PASSWORD"
          npx playwright test --config e2e-staging/playwright.staging.config.ts

      - name: Upload artifacts (screenshots, traces)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staging-e2e-artifacts
          path: |
            frontend/e2e-staging/artifacts/
            frontend/test-results/
          if-no-files-found: ignore
          retention-days: 7
